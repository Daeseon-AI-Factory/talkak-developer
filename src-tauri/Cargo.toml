[package]
name = "talkak-dev"
version = "0.1.0"
description = "A lightweight developer workspace for local agent sessions"
authors = ["Talkak"]
edition = "2021"

[lib]
name = "talkak_dev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
webdriver-ci = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
session_broker = { package = "talkak-dev-broker", path = "../session-broker", default-features = false }
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
