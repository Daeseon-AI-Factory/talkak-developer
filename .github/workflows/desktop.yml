name: Desktop product gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-product:
    name: macOS / product gate
    # cost-ok(PR code must not execute on a persistent self-hosted runner)
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'macos-latest' ||
      vars.CI_MACOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check CI contract
        run: pnpm ci:contract

      - name: Test renderer
        run: pnpm test

      - name: Type-check renderer
        run: pnpm typecheck

      - name: Lint renderer
        run: pnpm lint

      - name: Build renderer
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test native PTY backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build unsigned macOS app bundle
        run: pnpm tauri build --bundles app --no-sign --ci

      - name: Verify macOS app bundle
        run: test -x "src-tauri/target/release/bundle/macos/Talkak Dev.app/Contents/MacOS/talkak-dev"

  windows-product:
    name: Windows / product gate
    # PR code always uses an ephemeral GitHub runner; trusted pushes may use the configured runner.
    runs-on: >-
      ${{ github.event_name == 'pull_request' && 'windows-latest' ||
      vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check CI contract
        run: pnpm ci:contract

      - name: Test renderer
        run: pnpm test

      - name: Type-check renderer
        run: pnpm typecheck

      - name: Lint renderer
        run: pnpm lint

      - name: Build renderer
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test native ConPTY backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build unsigned Windows release NSIS installer
        run: pnpm tauri build --bundles nsis --no-sign --ci

      - name: Clean-install and launch Windows release package
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1 -ReleaseSmoke

      - name: Build unsigned Windows NSIS E2E installer
        run: >-
          pnpm tauri build --features webdriver-ci --bundles nsis --no-sign --ci
          --config src-tauri/tauri.windows-ci.conf.json

      - name: Clean-install and exercise Windows product path
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1
